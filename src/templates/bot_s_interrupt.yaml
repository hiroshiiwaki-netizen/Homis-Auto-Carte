# おひさまボット（Sのみ・電話再診・中断）
# 仕様: docs/SPEC_v3_cloud.md §12
# 失敗・二重防止は §7 / 2b。このファイルは手順だけ。
# 改定履歴（新しい順・全体は docs/SPEC_v3_cloud.md 0章「モジュール別の版」）:
#   1.3 2026/11/06 「算定不要が付いていれば外す」を足した（verify_unchecked・browser_actions 1.5.0）。問い合わせ・疑義照会は算定できるものも
#                  あるので ORCA登録不要にしない。新規では付いていないのでふだんは何もしない（DX担当 11/6「もし仮についてたら外す」）
#   1.2 2026/11/04 S の2手順に stop_on_fail（確かめられなければ保存しない・ライター cloud/server.py 3.6.0 が1回やり直す。
#                  DX担当「問い合わせで S 欄が空はあかん」）
#   1.1 2026/11/04 「電話再診を選択」に verify_checked（FAX と同じ）。S の入力に verify_value（見える欄を待つ・読み返す）。
#                  保存の直前に「S欄をもう一度確かめる」を足した（11/4 問い合わせ 0017: 表示が遅く S が空のまま中断で保存された）
#   1.0 2026/09/08 初版

name: おひさまボットS中断
description: おひさまボット確認後のカルテ（電話再診・Sのみ・中断）
version: "1.3"

target_url: "https://homis.jp/homic/?pid=patient_detail&patient_id={homisId}&p=5"

auth:
  type: homis
  detect_login: true

steps:
  - name: 新規ボタンをクリック
    action: click
    selector: "#karteNew"
    wait_after: 2000

  - name: 電話再診を選択
    action: click
    selector: "label"
    text_contains: "電話再診"
    verify_checked: true   # 2026-11-04: 選べたかを確かめる（fax_so と同じ）
    wait_after: 1000

  - name: 医科カルテボタンをクリック
    action: click
    selector_type: xpath
    selector: "//a[contains(text(), '医科カルテ')]"
    wait_after: 3000

  - name: 算定不要が付いていれば外す
    action: click
    selector: "#NoNeedToOrca"
    verify_unchecked: true   # 1.3: 印が無ければ押さない・付いていれば外して確かめる（FAX の fax_so は付ける・こちらは付けない）
    wait_after: 500

  - name: S欄に入力
    action: js_input
    selector: "textarea#subjective"
    value: "{sContent}"
    verify_value: true     # 2026-11-04: 見える欄が出るまで待って入れ、読み返す
    stop_on_fail: true     # 1.2: 確かめられなければ以後の手順と保存をしない（ライターが1回やり直す）
    wait_after: 2000

  - name: O欄に半角スペースを入力
    action: js_input
    selector: "textarea#objective"
    value: " "
    wait_after: 500

  - name: A/Pに半角スペースを入力
    action: js_input
    selector: "textarea#ap"
    value: " "
    wait_after: 500

  - name: 本日A/Pに半角スペースを入力
    action: js_input
    selector: "textarea#ap_today"
    value: " "
    wait_after: 500

  - name: 指導内容に半角スペースを入力
    action: js_input
    selector: "textarea#report"
    value: " "
    wait_after: 1000

  - name: S欄をもう一度確かめる
    action: js_input
    selector: "textarea#subjective"
    value: "{sContent}"
    verify_value: true     # 2026-11-04: 保存の直前にもう一度読み返す（同じなら何もしない・消えていれば入れ直す）
    stop_on_fail: true     # 1.2: 同上
    wait_after: 500

  - name: 中断ボタンで保存
    action: click
    selector: "#karteInterruption"
    confirm_alert_count: 2
    wait_after: 5000

on_complete:
  - name: リンクをコピー
    action: click
    selector_type: xpath
    selector: "//a[contains(@onclick, 'copyLinkOfKarte')]"
    wait_after: 1000

result:
  type: clipboard
  description: カルテURL
