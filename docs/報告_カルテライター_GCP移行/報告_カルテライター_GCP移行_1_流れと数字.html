<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カルテの書き道を Tukusi から GCP へ（1 流れと数字）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#e9ecef;font-family:'BIZ UDPGothic','BIZ UDPゴシック','Meiryo',sans-serif}
  .sheet{max-width:1684px;margin:0 auto;padding:10px}
  svg{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .note{max-width:1684px;margin:6px auto 14px;padding:0 12px;color:#5b616b;font-size:14px}
  @page{size:A4 landscape;margin:0}
  @media print{html,body{background:#fff}.sheet{padding:0;max-width:none}svg{box-shadow:none}.note{display:none}}
</style>
</head>
<body>
<div class="sheet">
<svg id="page1" viewBox="0 0 1684 1190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="カルテの書き道を Tukusi から GCP へ変えた報告 1枚目 流れと数字"
     font-family="'BIZ UDPGothic','BIZ UDPゴシック','Meiryo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/>
    </marker>
  </defs>

  <!-- 見出し -->
  <rect x="0" y="0" width="1684" height="92" fill="#1c3f5e"/>
  <text x="48" y="58" font-size="40" font-weight="700" fill="#fff">FAX・問い合わせのカルテ、書き道を Tukusi から GCP へ</text>
  <text x="1636" y="40" font-size="20" fill="#cfe2f3" text-anchor="end">報告（法人内）　2026-11-05　DX推進部</text>
  <text x="1636" y="72" font-size="20" fill="#cfe2f3" text-anchor="end">1 / 2　流れと数字</text>

  <!-- 前 -->
  <text x="48" y="148" font-size="26" font-weight="700" fill="#868e96">これまで（〜11/1）</text>
  <rect x="48" y="166" width="1588" height="150" rx="14" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>
  <g font-size="22" fill="#343a40">
    <rect x="80" y="180" width="250" height="54" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="205" y="215" text-anchor="middle" font-size="20">FAX・スキャン <tspan font-size="15" fill="#868e96">OhiScanGo</tspan></text>
    <rect x="80" y="248" width="250" height="54" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="205" y="283" text-anchor="middle" font-size="20">問い合わせ <tspan font-size="15" fill="#868e96">OhisamaBot</tspan></text>
    <line x1="330" y1="207" x2="600" y2="230" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
    <line x1="330" y1="275" x2="600" y2="250" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="610" y="186" width="420" height="106" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
    <text x="820" y="222" text-anchor="middle" font-weight="700">Tukusi のロボット（p281 のパソコン）</text>
    <text x="820" y="252" text-anchor="middle" font-size="19">ブラウザを人のように操作して HOMIS に貼る</text>
    <text x="820" y="278" text-anchor="middle" font-size="17" fill="#c92a2a">操作が終われば「成功」。保存後の中身は確かめない</text>
    <line x1="1030" y1="239" x2="1120" y2="239" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="1130" y="196" width="190" height="86" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="1225" y="245" text-anchor="middle" font-weight="700">HOMIS</text>
    <text x="1345" y="226" font-size="19" fill="#c92a2a">● 空のカルテが残る（7 件）</text>
    <text x="1345" y="256" font-size="19" fill="#c92a2a">● 同じ患者さんを上書き（3 回）</text>
    <text x="1345" y="286" font-size="19" fill="#c92a2a">● p281 の操作が詰まると止まる</text>
  </g>

  <!-- 後 -->
  <text x="48" y="372" font-size="26" font-weight="700" fill="#1c7ed6">これから（FAX 11/2〜・問い合わせ 11/5〜）</text>
  <rect x="48" y="390" width="1588" height="330" rx="14" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
  <g font-size="22" fill="#343a40">
    <rect x="80" y="430" width="190" height="86" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="175" y="466" text-anchor="middle">FAX・スキャン</text>
    <text x="175" y="496" text-anchor="middle" font-size="18" fill="#868e96">OhiScanGo</text>
    <rect x="80" y="560" width="190" height="86" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="175" y="596" text-anchor="middle">問い合わせ</text>
    <text x="175" y="626" text-anchor="middle" font-size="18" fill="#868e96">OhisamaBot</text>
    <line x1="270" y1="473" x2="350" y2="473" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <line x1="270" y1="603" x2="350" y2="603" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <rect x="360" y="430" width="170" height="216" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="445" y="520" text-anchor="middle">Tukusi API</text>
    <text x="445" y="550" text-anchor="middle" font-size="18" fill="#868e96">読んで渡すだけ</text>
    <line x1="530" y1="538" x2="610" y2="538" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <rect x="620" y="430" width="200" height="216" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="720" y="500" text-anchor="middle" font-weight="700">受け口</text>
    <text x="720" y="530" text-anchor="middle" font-size="18" fill="#868e96">GCP Cloud Run</text>
    <text x="720" y="562" text-anchor="middle" font-size="18">患者さんの照合</text>
    <text x="720" y="590" text-anchor="middle" font-size="18">合言葉の確認</text>
    <line x1="820" y1="500" x2="900" y2="500" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <line x1="820" y1="580" x2="900" y2="580" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <rect x="910" y="470" width="150" height="56" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="985" y="505" text-anchor="middle" font-size="19">FAX の列</text>
    <rect x="910" y="552" width="150" height="56" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="985" y="587" text-anchor="middle" font-size="19">問い合わせの列</text>
    <text x="985" y="640" text-anchor="middle" font-size="17" fill="#868e96">順番に 1 件ずつ</text>
    <line x1="1060" y1="498" x2="1140" y2="520" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <line x1="1060" y1="580" x2="1140" y2="556" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <rect x="1150" y="430" width="230" height="216" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="1265" y="470" text-anchor="middle" font-weight="700">カルテライター</text>
    <text x="1265" y="498" text-anchor="middle" font-size="16" fill="#868e96">GCP Cloud Run・Chrome</text>
    <text x="1265" y="534" text-anchor="middle" font-size="18">① 患者さんごとの札</text>
    <text x="1265" y="562" text-anchor="middle" font-size="18">② 新規 → 書く → 保存</text>
    <text x="1265" y="590" text-anchor="middle" font-size="18">③ 読み直して確かめる</text>
    <text x="1265" y="618" text-anchor="middle" font-size="18">④ 結果を記録</text>
    <line x1="1380" y1="538" x2="1450" y2="538" stroke="#1c7ed6" stroke-width="3" marker-end="url(#arb)"/>
    <rect x="1460" y="470" width="150" height="86" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
    <text x="1535" y="520" text-anchor="middle" font-weight="700">HOMIS</text>
    <path d="M1265,646 L1265,690" stroke="#e03131" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
    <rect x="1010" y="664" width="510" height="44" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
    <text x="1265" y="693" text-anchor="middle" font-size="19" fill="#c92a2a">書けなければ 1 分以内に現場と DX の Chat へ通知</text>
  </g>

  <!-- 数字 -->
  <text x="48" y="776" font-size="26" font-weight="700" fill="#343a40">結果（11/2〜11/5 15時・ログから）</text>
  <g>
    <rect x="48" y="794" width="380" height="170" rx="14" fill="#fff" stroke="#ced4da" stroke-width="2"/>
    <text x="238" y="830" font-size="22" text-anchor="middle" fill="#495057">FAX のカルテ（本番）</text>
    <text x="238" y="900" font-size="54" font-weight="700" text-anchor="middle" fill="#1c7ed6">147 / 152</text>
    <text x="238" y="940" font-size="16" text-anchor="middle" fill="#495057">成功 97%・対策後の失敗 4 件はすべてその場で通知</text>

    <rect x="452" y="794" width="380" height="170" rx="14" fill="#fff" stroke="#ced4da" stroke-width="2"/>
    <text x="642" y="830" font-size="22" text-anchor="middle" fill="#495057">問い合わせのカルテ</text>
    <text x="642" y="900" font-size="54" font-weight="700" text-anchor="middle" fill="#1c7ed6">9 / 9</text>
    <text x="642" y="940" font-size="16" text-anchor="middle" fill="#495057">11/5 本番開始。並走試験 100 件も修正後は失敗 0</text>

    <rect x="856" y="794" width="380" height="170" rx="14" fill="#fff" stroke="#ced4da" stroke-width="2"/>
    <text x="1046" y="830" font-size="22" text-anchor="middle" fill="#495057">1 件を書く時間</text>
    <text x="1046" y="900" font-size="54" font-weight="700" text-anchor="middle" fill="#1c7ed6">約 50 秒</text>
    <text x="1046" y="940" font-size="16" text-anchor="middle" fill="#495057">受け取り → 新規 → 保存 → 読み直しまで</text>

    <rect x="1260" y="794" width="376" height="170" rx="14" fill="#fff" stroke="#ced4da" stroke-width="2"/>
    <text x="1448" y="830" font-size="22" text-anchor="middle" fill="#495057">気づかない失敗（対策後）</text>
    <text x="1448" y="900" font-size="54" font-weight="700" text-anchor="middle" fill="#2f9e44">0 件</text>
    <text x="1448" y="940" font-size="16" text-anchor="middle" fill="#495057">保存後に読み直し、不一致・未完了は必ず通知</text>
  </g>

  <!-- 比べ方の注意 -->
  <rect x="48" y="990" width="1588" height="150" rx="14" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="72" y="1026" font-size="22" font-weight="700" fill="#e67700">Tukusi 時代と比べるときの注意</text>
  <text x="72" y="1062" font-size="19" fill="#495057">・Tukusi は操作が終われば「成功」になり、保存後のカルテの中身までは確かめていなかった（10/23〜28 の照合で空のカルテ 7 件、過去に上書き 3 回を確認）。</text>
  <text x="72" y="1094" font-size="19" fill="#495057">・GCP 移行後に書けなかったのは計 5 件。うち 3 件は職員が同じ患者さんのカルテを開いていたため（初日の 1 件は対策前で成功扱い・通知なし。11/4・11/5 の各 1 件は通知済み。今は 90 秒待って 1 回やり直す）。</text>
  <text x="72" y="1126" font-size="19" fill="#495057">・残り 2 件（11/4）は、読み直しで本文の不一致に気づき、その場で現場へ通知した。</text>

  <text x="1636" y="1172" font-size="16" fill="#868e96" text-anchor="end">数字の出どころ: ライターの記録（Cloud Logging）・WORK_LOG 10/29・11/2〜11/5　／　患者さんの情報は載せていません</text>
</svg>
</div>
<p class="note">A4 横 1 枚目。2026-11-05 v1.2（黒ヤギ2回目【進めてよい】: 言い回し）。印刷するときはブラウザの印刷で「背景のグラフィック」を有効に。</p>
</body>
</html>
