<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" role="img" aria-label="カルテライターのロボット">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8bec6"/><stop offset=".22" stop-color="#f2cf3a"/>
      <stop offset=".62" stop-color="#f4c531"/><stop offset="1" stop-color="#f08a2c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3772e"/><stop offset="1" stop-color="#d94f2a"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c63a"/><stop offset="1" stop-color="#ee7d2c"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa9c9"/><stop offset="1" stop-color="#5f7fa8"/>
    </linearGradient>
  </defs>
  <!-- アンテナ（くねくね） -->
  <path d="M60 30 V22 q0 -5 5 -5 h6 q5 0 5 -5 q0 -5 -5 -5 h-4" fill="none" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
  <circle cx="65" cy="6" r="3.2" fill="#9aa3ad"/>
  <!-- 帽子 -->
  <ellipse cx="60" cy="34" rx="12" ry="6" fill="#a7afb8"/>
  <rect x="48" y="30" width="24" height="6" rx="3" fill="#b9c0c8"/>
  <!-- 頭（カプセル） -->
  <path d="M32 72 C32 46 44 36 60 36 C76 36 88 46 88 72 V84 C88 96 78 100 60 100 C42 100 32 96 32 84 Z" fill="url(#head)"/>
  <!-- さび -->
  <g fill="#8d8f8c" opacity=".55">
    <path d="M38 62 q4 -4 9 -1 q3 4 -2 6 q-5 1 -7 -5z"/><path d="M70 50 q6 -2 8 3 q-2 4 -7 3z"/>
    <path d="M52 56 q3 -2 5 1 q-1 3 -4 2z"/><path d="M78 66 q4 0 5 4 q-3 2 -6 -1z"/>
    <path d="M44 88 q5 -1 6 3 q-3 2 -6 0z"/>
  </g>
  <!-- 目 -->
  <g>
    <circle cx="48" cy="80" r="7.5" fill="#e3b33a"/><circle cx="48" cy="80" r="5.4" fill="#7fa6d6"/><circle cx="46.5" cy="78.5" r="1.6" fill="#fff" opacity=".85"/>
    <circle cx="72" cy="80" r="7.5" fill="#e3b33a"/><circle cx="72" cy="80" r="5.4" fill="#7fa6d6"/><circle cx="70.5" cy="78.5" r="1.6" fill="#fff" opacity=".85"/>
  </g>
  <!-- 胴 -->
  <path d="M38 102 H82 Q88 102 88 110 V122 Q88 136 60 136 Q32 136 32 122 V110 Q32 102 38 102 Z" fill="url(#body)"/>
  <path d="M33 114 Q60 122 87 114" fill="none" stroke="#c4462a" stroke-width="2.5"/>
  <g fill="#8d8f8c" opacity=".45"><path d="M42 106 q4 -1 5 2 q-2 2 -5 0z"/><path d="M70 124 q5 0 5 3 q-3 2 -6 0z"/></g>
  <!-- 腕（筒と手） -->
  <rect x="18" y="104" width="14" height="22" rx="5" fill="url(#arm)"/>
  <path d="M20 128 l-3 6 M25 128 v7 M30 128 l3 6" stroke="#8b8f94" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="88" y="100" width="14" height="22" rx="5" fill="url(#arm)"/>
  <path d="M90 124 l-3 6 M95 124 v7 M100 124 l3 6" stroke="#8b8f94" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 足（青い長靴） -->
  <rect x="44" y="134" width="11" height="14" fill="#7d96b8"/>
  <rect x="65" y="134" width="11" height="14" fill="#7d96b8"/>
  <path d="M38 148 Q38 142 46 142 H55 Q60 142 60 150 V156 H38 Z" fill="url(#boot)"/>
  <path d="M60 150 Q60 142 66 142 H74 Q82 142 82 148 V156 H60 Z" fill="url(#boot)"/>
  <ellipse cx="60" cy="160" rx="30" ry="3.5" fill="#000" opacity=".12"/>
</svg>
